name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Next.js build не обращается к Supabase/Telegram во время сборки — эти
# значения нужны только для прохождения проверки обязательных переменных
# окружения (см. lib/utils/env.ts) и никогда не используются для реальных
# сетевых запросов в CI.
env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
  TELEGRAM_BOT_TOKEN: test-token
  TELEGRAM_CHAT_ID: "123456"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
